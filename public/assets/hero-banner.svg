<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="courtBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151517"/>
      <stop offset="60%" stop-color="#231F21"/>
      <stop offset="100%" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A1D19"/>
      <stop offset="50%" stop-color="#40312D"/>
      <stop offset="100%" stop-color="#2A1D19"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B67F3D"/>
      <stop offset="50%" stop-color="#E5C994"/>
      <stop offset="100%" stop-color="#B67F3D"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#courtBg)"/>

  <!-- Classical Courtroom Pillars (Stone) -->
  <rect x="80" y="20" width="48" height="260" fill="#3C3538" opacity="0.6"/>
  <rect x="74" y="16" width="60" height="12" fill="#4A4245" opacity="0.8"/>
  <rect x="74" y="272" width="60" height="12" fill="#4A4245" opacity="0.8"/>

  <rect x="220" y="20" width="48" height="260" fill="#3C3538" opacity="0.4"/>
  <rect x="214" y="16" width="60" height="12" fill="#4A4245" opacity="0.6"/>
  <rect x="214" y="272" width="60" height="12" fill="#4A4245" opacity="0.6"/>

  <rect x="932" y="20" width="48" height="260" fill="#3C3538" opacity="0.4"/>
  <rect x="926" y="16" width="60" height="12" fill="#4A4245" opacity="0.6"/>
  <rect x="926" y="272" width="60" height="12" fill="#4A4245" opacity="0.6"/>

  <rect x="1072" y="20" width="48" height="260" fill="#3C3538" opacity="0.6"/>
  <rect x="1066" y="16" width="60" height="12" fill="#4A4245" opacity="0.8"/>
  <rect x="1066" y="272" width="60" height="12" fill="#4A4245" opacity="0.8"/>

  <!-- Central Judge Bench (Mahogany) -->
  <path d="M520 180 L680 180 L720 320 L480 320 Z" fill="url(#woodBench)"/>
  <rect x="500" y="170" width="200" height="15" rx="3" fill="#40312D"/>
  <rect x="500" y="182" width="200" height="3" fill="url(#goldTrim)"/>

  <!-- Owl Mascot at Judge Bench -->
  <!-- Owl Body -->
  <ellipse cx="600" cy="140" rx="42" ry="48" fill="#2A1D19" stroke="#E5C994" stroke-width="2"/>
  <!-- Feather Tufts -->
  <polygon points="575,100 565,80 585,92" fill="#B67F3D"/>
  <polygon points="625,100 635,80 615,92" fill="#B67F3D"/>
  <!-- Eyes -->
  <circle cx="586" cy="130" r="14" fill="#FBFAF8" stroke="#B67F3D" stroke-width="2"/>
  <circle cx="614" cy="130" r="14" fill="#FBFAF8" stroke="#B67F3D" stroke-width="2"/>
  <circle cx="586" cy="130" r="7" fill="#151517"/>
  <circle cx="614" cy="130" r="7" fill="#151517"/>
  <circle cx="589" cy="127" r="2" fill="#FFFFFF"/>
  <circle cx="617" cy="127" r="2" fill="#FFFFFF"/>
  <!-- Golden Beak -->
  <polygon points="600,138 594,148 606,148" fill="#E0A64A"/>
  <!-- Suit / Collar -->
  <path d="M585 160 L615 160 L620 180 L580 180 Z" fill="#FBFAF8"/>
  <polygon points="597,160 603,160 600,174" fill="#9B2C2C"/>

  <!-- Wooden Gavel on Bench -->
  <rect x="650" y="195" width="38" height="14" rx="2" fill="#40312D" stroke="#B67F3D" stroke-width="1.5" transform="rotate(-15 650 195)"/>
  <rect x="664" y="202" width="6" height="30" rx="2" fill="#B67F3D" transform="rotate(-15 664 202)"/>
</svg>
