<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle with gold border -->
  <circle cx="50" cy="50" r="46" fill="#151517" stroke="#B67F3D" stroke-width="4"/>
  
  <!-- Owl Head Base -->
  <path d="M28 62 C28 42, 35 30, 50 30 C65 30, 72 42, 72 62 C72 74, 62 82, 50 82 C38 82, 28 74, 28 62 Z" fill="#2A1D19" stroke="#E5C994" stroke-width="2"/>
  
  <!-- Feather Tufts / Horns -->
  <polygon points="32,34 26,20 40,28" fill="#B67F3D"/>
  <polygon points="68,34 74,20 60,28" fill="#B67F3D"/>

  <!-- Owl Eyes (Large Circles) -->
  <circle cx="40" cy="48" r="10" fill="#FBFAF8" stroke="#B67F3D" stroke-width="2"/>
  <circle cx="60" cy="48" r="10" fill="#FBFAF8" stroke="#B67F3D" stroke-width="2"/>
  <circle cx="40" cy="48" r="5" fill="#151517"/>
  <circle cx="60" cy="48" r="5" fill="#151517"/>
  <circle cx="42" cy="46" r="1.5" fill="#FFFFFF"/>
  <circle cx="62" cy="46" r="1.5" fill="#FFFFFF"/>

  <!-- Golden Beak -->
  <polygon points="50,54 45,62 55,62" fill="#E0A64A"/>

  <!-- Legal Jabot / Tie -->
  <path d="M46 68 L54 68 L56 78 L44 78 Z" fill="#FAF8F5" stroke="#E8E2D8" stroke-width="1"/>
  <line x1="50" y1="68" x2="50" y2="78" stroke="#B67F3D" stroke-width="1"/>

  <!-- Mini Gavel Motif at base -->
  <rect x="42" y="85" width="16" height="4" rx="2" fill="#B67F3D"/>
</svg>
